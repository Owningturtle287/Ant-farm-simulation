name: Deploy Little Colony

on:
  push:
    branches: [main]
    paths: ['web/**', 'tests-web/**', 'scripts/*-web.mjs', 'package.json', 'playwright.config.mjs', '.github/workflows/pages.yml']
  pull_request:
    paths: ['web/**', 'tests-web/**', 'scripts/*-web.mjs', 'package.json', 'playwright.config.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the living colony and save recovery
        run: node --test tests-web/sim.test.mjs
      - name: Build offline web app
        run: node scripts/build-web.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload playable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build app
        run: node scripts/build-web.mjs
      - name: Check play, phone layout, saves, Home Screen setup, and offline reopening
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload game screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-preview-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the playable game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show the phone bookmark link
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### Your ant farm is live" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Little Colony]($GAME_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "On iPhone: open in Safari, then Share → Add to Home Screen." >> "$GITHUB_STEP_SUMMARY"
