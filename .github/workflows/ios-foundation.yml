name: iOS Foundation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      signed_adhoc:
        description: Build signed ad hoc IPA (requires Apple signing secrets)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-foundation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Validate, test, and build iPhone preview
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain and validate source
        run: |
          xcodebuild -version
          python3 scripts/validate.py
          plutil -lint AntFarm.xcodeproj/project.pbxproj AntFarm/Info.plist
      - name: Choose an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/simulators.json'))
          phones = [d for runtime, devices in data['devices'].items() if '.iOS-' in runtime
                    for d in devices if d.get('isAvailable') and d['name'].startswith('iPhone')]
          assert phones, 'No installed iPhone simulator runtime is available on this runner.'
          phone = phones[0]
          print('Selected simulator:', phone['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_UDID=' + phone['udid'] + '\n')
          PY
      - name: Run native fixture and interaction checks
        run: |
          xcodebuild -project AntFarm.xcodeproj -scheme AntFarm -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Launch simulator app and capture actual preview
        run: |
          mkdir -p build/preview
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/AntFarm.app
          xcrun simctl terminate "$SIMULATOR_UDID" com.owningturtle.antfarm || true
          xcrun simctl launch "$SIMULATOR_UDID" com.owningturtle.antfarm
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/preview/native-landscape.png
          python3 scripts/validate.py > build/preview/validation.txt
          printf '%s\n' 'Static design scene, steps 1-2. This is not a running colony simulation.' > build/preview/README.txt
      - name: Build unsigned physical-device app
        run: |
          xcodebuild -project AntFarm.xcodeproj -scheme AntFarm -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p build/unsigned/Payload
          cp -R build/Device/Build/Products/Release-iphoneos/AntFarm.app build/unsigned/Payload/
          (cd build/unsigned && zip -qry ../AntFarm-unsigned.ipa Payload)
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: AntFarm-simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/AntFarm.app
          retention-days: 14
          if-no-files-found: error
      - name: Upload unsigned device IPA (requires re-signing)
        uses: actions/upload-artifact@v4
        with:
          name: AntFarm-unsigned-device
          path: build/AntFarm-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Upload actual preview and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AntFarm-design-preview
          path: |
            build/preview/
            build/Tests.xcresult
          retention-days: 14

  signed-adhoc:
    name: Optional signed ad hoc distribution
    if: github.event_name == 'workflow_dispatch' && inputs.signed_adhoc
    needs: foundation
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive and export with supplied Apple credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/signed-build.sh
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: AntFarm-signed-adhoc
          path: build/signed/*.ipa
          retention-days: 14
          if-no-files-found: error
