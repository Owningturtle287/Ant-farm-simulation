name: Little Colony · iPhone

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      signed_adhoc:
        description: Also create a signed ad hoc IPA using Apple signing secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iphone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playable:
    name: Test colony, build iPhone app, verify controls
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Generate project and report pinned toolchain
        run: |
          xcodebuild -version
          python3 scripts/generate_project.py
          plutil -lint AntFarm.xcodeproj/project.pbxproj AntFarm/Info.plist AntFarm/PrivacyInfo.xcprivacy
      - name: Exercise colony lifecycle, accounting, routes, and saves
        run: swift test --parallel
      - name: Select an iPhone simulator
        run: python3 scripts/choose_simulator.py
      - name: Build simulator app and UI tests
        run: |
          xcodebuild -project AntFarm.xcodeproj -scheme AntFarm -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build-for-testing > simulator-build.log 2>&1 \
            || { tail -160 simulator-build.log; exit 1; }
      - name: Build downloadable unsigned iPhone IPA
        run: |
          xcodebuild -project AntFarm.xcodeproj -scheme AntFarm -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO build > device-build.log 2>&1 \
            || { tail -160 device-build.log; exit 1; }
          mkdir -p build/unsigned/Payload
          cp -R build/Device/Build/Products/Release-iphoneos/AntFarm.app build/unsigned/Payload/
          (cd build/unsigned && zip -qry ../LittleColony-unsigned.ipa Payload)
          cp docs/INSTALL.md build/INSTALL.md
      - name: Verify touch controls and ant inspection
        timeout-minutes: 12
        run: |
          xcodebuild -project AntFarm.xcodeproj -scheme AntFarm -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData -resultBundlePath build/Playthrough.xcresult \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO test-without-building > ui-tests.log 2>&1 \
            || { tail -180 ui-tests.log; exit 1; }
      - name: Capture the running game
        run: |
          mkdir -p build/preview
          xcrun xcresulttool export attachments --path build/Playthrough.xcresult --output-path build/preview/attachments
          python3 - <<'PY'
          from pathlib import Path
          images = list(Path('build/preview').rglob('*.png'))
          assert images, 'The native playthrough produced no screenshots.'
          print('Exported',len(images),'actual simulator screenshots from the playthrough.')
          PY
      - name: Upload downloadable iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: LittleColony-0.1-unsigned-iphone-${{ github.sha }}
          path: |
            build/LittleColony-unsigned.ipa
            build/INSTALL.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload actual game screenshots
        uses: actions/upload-artifact@v4
        with:
          name: LittleColony-game-preview
          path: build/preview/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LittleColony-diagnostics
          path: |
            simulator-build.log
            device-build.log
            ui-tests.log
            build/Playthrough.xcresult
          retention-days: 14

  signed:
    name: Signed iPhone distribution
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.signed_adhoc)
    needs: playable
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_project.py
      - name: Check whether Apple signing is configured
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          SIGNING_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_adhoc }}
        run: |
          python3 - <<'PY'
          import os
          keys = ['BUILD_CERTIFICATE_BASE64','P12_PASSWORD','BUILD_PROVISION_PROFILE_BASE64']
          missing = [key for key in keys if not os.environ.get(key)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready='+('false' if missing else 'true')+'\n')
          if missing:
              print('::notice::Signed IPA not produced. Missing signing secrets: '+', '.join(missing))
              if os.environ.get('SIGNING_REQUIRED') == 'true': raise SystemExit(1)
          else:
              print('Apple signing configuration is present. Attempting signed export.')
          PY
      - name: Sign and export ad hoc IPA
        if: steps.signing.outputs.ready == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/signed-build.sh
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: LittleColony-0.1-signed-iphone-${{ github.sha }}
          path: build/signed/*.ipa
          if-no-files-found: error
          retention-days: 30
