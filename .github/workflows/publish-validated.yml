name: Publish validated Little Colony

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-validated.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  VALIDATED_SHA: f3bd5cf4cbcf34d594dad3401340422799b992db
  VALIDATED_RUN: '44105163316'

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify this is the already tested game
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const run_id = Number(process.env.VALIDATED_RUN);
            const sha = process.env.VALIDATED_SHA;
            const {data: run} = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', {owner, repo, run_id});
            if (run.head_sha !== sha || run.head_branch !== 'main' || run.event !== 'push') {
              throw new Error('The validation run must belong to the expected main-branch source.');
            }
            const {data: comparison} = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {owner, repo, basehead: `${sha}...${context.sha}`});
            if (!['ahead', 'identical'].includes(comparison.status) || !comparison.files || comparison.files.length >= 300 || comparison.files.some(file => !file.filename.startsWith('.github/workflows/') || file.previous_filename && !file.previous_filename.startsWith('.github/workflows/'))) {
              throw new Error('Application source differs from the validated game. Run the full validation workflow.');
            }
            const {data: {jobs}} = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs', {owner, repo, run_id, filter: 'latest', per_page: 100});
            for (const name of ['browser-checks (chromium)', 'browser-checks (webkit)']) {
              if (!jobs.some(job => job.name === name && job.status === 'completed' && job.conclusion === 'success')) {
                throw new Error(`${name} did not pass for the validated source.`);
              }
            }
            const build = jobs.find(job => job.name === 'build');
            for (const name of ['Verify the living colony and save recovery', 'Verify 120 modeled days at default reproduction']) {
              if (!build?.steps?.some(step => step.name === name && step.status === 'completed' && step.conclusion === 'success')) {
                throw new Error(`${name} did not pass for the validated source.`);
              }
            }
            await core.summary.addHeading('Publishing the already validated game')
              .addRaw(`Source: ${sha}\n\n108 simulation tests, the 120-day default run, and both browser suites passed. Only workflow files have changed. Capacity measurements do not gate this publication.\n\n`)
              .addLink('Validation evidence', run.html_url).write();
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the validated offline game
        run: node scripts/build-web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish the playable game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show the iPhone link
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### Little Colony is live" >> "$GITHUB_STEP_SUMMARY"
          echo "[Play Little Colony]($GAME_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "On iPhone: Safari → Share → Add to Home Screen." >> "$GITHUB_STEP_SUMMARY"
