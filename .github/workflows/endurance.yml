name: Check Little Colony endurance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 120 modeled days at default reproduction
        run: |
          set -o pipefail
          node scripts/endurance-sim.mjs simulation-endurance.json | tee simulation-checkpoints.log
      - name: Upload long-run simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-endurance
          path: |
            simulation-endurance.json
            simulation-checkpoints.log
          retention-days: 30
